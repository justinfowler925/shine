<!DOCTYPE html>
<!-- shine-lint: off color — kit-faithful Magic UI DNA (display type, radius xl, chroma high, glow). -->
<html lang="en" data-cite="magicui-hero" data-dna-family="magicui" data-dna-chroma="high" data-shine-voice="kit-faithful">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shine — retrieve a real page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Geist:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: oklch(0.12 0.04 300);
    --fg: oklch(0.98 0.01 300);
    --muted: oklch(0.78 0.04 300);
    --accent: oklch(0.72 0.22 320);
    --accent-fg: oklch(0.16 0.04 320);
    --glow: oklch(0.72 0.22 320 / 0.45);
    --radius: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(80% 60% at 70% 10%, var(--glow), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: Geist, ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .hero {
    max-width: 960px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  h1 {
    font-family: Fraunces, ui-serif, Georgia, serif;
    font-size: 48px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 16px;
    max-width: 18ch;
  }
  .lede {
    font-size: 20px;
    color: var(--muted);
    max-width: 36ch;
    margin: 0 0 32px;
  }
  .cta {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 12px 24px;
    background: var(--accent); color: var(--accent-fg);
    border: 0; border-radius: 999px;
    font: 500 16px/1 Geist, ui-sans-serif, system-ui, sans-serif;
    cursor: pointer;
    box-shadow: 0 12px 40px var(--glow);
  }
  .stage {
    margin-top: 48px;
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid oklch(0.4 0.08 300);
    box-shadow: 0 24px 80px var(--glow);
    min-height: 420px;
    background: oklch(0.2 0.06 300);
  }
  .poster {
    display: block; width: 100%; height: 420px;
    object-fit: cover;
    background:
      linear-gradient(135deg, oklch(0.35 0.14 300), oklch(0.18 0.08 250));
  }
  .play {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    border: 0; background: transparent; cursor: pointer; padding: 0;
  }
  .play-disc {
    width: 80px; height: 80px; border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 8px 32px var(--glow);
    display: grid; place-items: center;
  }
  .play-disc span {
    display: block; width: 0; height: 0;
    border-style: solid;
    border-width: 10px 0 10px 18px;
    border-color: transparent transparent transparent var(--accent-fg);
    margin-left: 4px;
  }
</style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>Name the job. Retrieve the page. Prove it.</h1>
      <p class="lede">A design system agents cannot sand into one house look. Cite a real template, apply its DNA, measure the box.</p>
      <p><button class="cta" type="button" data-primary>Start from a cite</button></p>
      <div class="stage" data-region="hero">
        <div class="poster" role="img" aria-label="Product walkthrough still"></div>
        <button class="play" type="button" aria-label="Play video">
          <span class="play-disc"><span></span></span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
