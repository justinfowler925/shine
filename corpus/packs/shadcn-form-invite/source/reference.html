<!doctype html>
<html lang="en" data-cite="shadcn-form-invite">
<head><meta charset="utf-8"/><title>Invite teammate</title><style>
:root{color-scheme:light;--bg:#fafafa;--panel:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:#18181b;--accent-ink:#fafafa}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px}
aside h1{font-size:15px;margin:0 0 12px}
nav a{display:block;padding:8px 10px;color:var(--ink);text-decoration:none;border-radius:6px}
nav a[aria-current=page]{background:#f4f4f5;font-weight:600}
main{padding:32px 40px;max-width:720px}
h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}.lede{margin:0 0 20px;color:var(--muted)}
label{display:grid;gap:6px;margin:0 0 14px;font-size:13px;font-weight:600}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.actions{display:flex;gap:10px;margin-top:8px}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;padding:10px 16px;border-radius:8px;font:inherit;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);padding:10px 16px;border-radius:8px;font:inherit}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.error{color:#b91c1c;font-size:12px;font-weight:500}
main{max-width:560px;margin:40px auto;padding:0 24px}</style></head>
<body>
<main data-region="form-app">
<div class="card">
<h1 style="font-size:22px;margin:0 0 6px">Invite teammate</h1>
<p class="lede">Send an Operate seat invite with a role and message.</p>
<form id="invite">
<label>Work email<input id="email" name="email" type="email" required autocomplete="email" /></label>
<label>Role<select id="role" name="role"><option>Operator</option><option>Admin</option><option>Viewer</option></select></label>
<label>Message<textarea id="msg" name="message" rows="3" placeholder="Optional context for the invite"></textarea></label>
<div id="errors" role="alert" hidden class="error"></div>
<div class="actions">
<button class="primary" type="submit">Send invite</button>
<button class="ghost" type="button" id="cancel">Cancel</button>
</div>
</form>
<p id="status" role="status"></p>
</div>
</main>
<script>
const form=document.getElementById("invite");
const errors=document.getElementById("errors");
form.onsubmit=(e)=>{e.preventDefault();const email=document.getElementById("email");
if(!email.value.includes("@")){email.setAttribute("aria-invalid","true");errors.hidden=false;errors.textContent="Enter a work email with @.";errors.id="email-error";email.setAttribute("aria-describedby","email-error");return;}
email.removeAttribute("aria-invalid");errors.hidden=true;document.getElementById("status").textContent="Invite sent to "+email.value;};
</script>
</body></html>
