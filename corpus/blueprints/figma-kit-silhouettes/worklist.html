<!doctype html>
<html lang="en" data-cite="shadcn-operate-decide" data-shine-voice="kit-faithful" data-dna-family="shadcn-zinc" data-kit-map="figma-library-map" data-figma-sources="UI Prep Data Tables;Simple Design System/Table;Clearspeed CTAs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kit silhouette — worklist</title>
  <link rel="stylesheet" href="../../../tokens/voices/shadcn-zinc.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fafafa;color:#18181b;font:14px/1.45 ui-sans-serif,system-ui}
    main{max-width:1080px;margin:0 auto;padding:28px 24px}
    h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
    .fresh{margin:0 0 16px;color:#71717a;font-size:13px}
    .lead{display:flex;gap:20px;flex-wrap:wrap;margin:0 0 16px}
    .lead .chip span{display:block;font-size:12px;color:#71717a}
    .lead .chip strong{font-size:18px;font-variant-numeric:tabular-nums}
    .panel{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:16px}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
    .toolbar input,.toolbar select{min-height:36px;padding:0 12px;border:1px solid #e4e4e7;border-radius:8px;background:#fff;font:inherit}
    .btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid #e4e4e7;border-radius:8px;background:#fff;font:600 13px/1 ui-sans-serif;cursor:pointer}
    .btn.filled{background:#18181b;border-color:#18181b;color:#fafafa}
    .btn.ghost{border-color:transparent;background:transparent}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px 8px;border-bottom:1px solid #f4f4f5;text-align:left}
    th{font-size:12px;color:#71717a}
    .actions{display:inline-flex;align-items:center;gap:6px}
    .note{margin:16px 0 0;color:#71717a;font-size:12px}
  </style>
</head>
<body>
  <main data-shine-main data-region="queue">
    <h1 data-page-title>Open notices</h1>
    <p class="fresh">UI Prep columns + SDS table + Clearspeed CTA budget · house paint</p>

    <section class="lead" data-region="summary-lead" data-summary aria-label="Queue posture">
      <div class="chip"><span>Open</span><strong>8</strong></div>
      <div class="chip"><span>New</span><strong>3</strong></div>
      <div class="chip"><span>High</span><strong>1</strong></div>
    </section>

    <section class="panel" data-region="focal" data-shine-focal data-grid>
      <div class="toolbar" role="search" data-toolbar>
        <input type="search" aria-label="Search notices" placeholder="Search title, agency">
        <select aria-label="Saved view"><option>All open</option><option>David's 10</option></select>
        <button type="button" class="btn ghost" data-clear-filters>Clear</button>
      </div>
      <table>
        <thead>
          <tr>
            <th scope="col"><input type="checkbox" aria-label="Select all"></th>
            <th scope="col">Notice</th>
            <th scope="col">Agency</th>
            <th scope="col">Score</th>
            <th scope="col">Decision</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="checkbox" aria-label="Select notice 1"></td>
            <td>Network modernization RFP</td>
            <td>GSA</td>
            <td>92</td>
            <td>
              <div class="actions" data-overflow="attached">
                <button type="button" class="btn filled">Pursue</button>
                <button type="button" class="btn" aria-haspopup="menu" aria-label="More actions">More</button>
              </div>
            </td>
          </tr>
          <tr>
            <td><input type="checkbox" aria-label="Select notice 2"></td>
            <td>Cloud migration support</td>
            <td>DHS</td>
            <td>81</td>
            <td>
              <div class="actions" data-overflow="attached">
                <button type="button" class="btn filled">Pursue</button>
                <button type="button" class="btn" aria-haspopup="menu" aria-label="More actions">More</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
    <p class="note">Ban: accordion under lead · detached More · peer grids · KPI card wall</p>
  </main>
</body>
</html>
