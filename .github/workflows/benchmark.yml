name: shine-benchmark
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark-smoke:
    name: benchmark-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run benchmark:test
      - run: npm run benchmark:quality
      - run: npm run benchmark:smoke

  benchmark-full:
    name: deterministic-full
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run benchmark:full
      - uses: actions/upload-artifact@v4
        with:
          name: shine-benchmark-review
          path: /tmp/shine-benchmark
          retention-days: 14

  native-agent-release:
    name: native-agent-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Six-category bounded native-agent evaluation
        env:
          SHINE_AGENT_CONCURRENCY: 1
          SHINE_AGENT_TIMEOUT_MS: 180000
        # Portable /tmp out dir (os.tmpdir). Set repo variable
        # SHINE_AGENT_BASELINE_ROOT when dispatching this lane with a baseline tree.
        run: npm run benchmark:agent:representative -- --out /tmp/shine-production-corpus
      - uses: actions/upload-artifact@v4
        with:
          name: shine-native-agent-review
          path: /tmp/shine-production-corpus
          retention-days: 30
