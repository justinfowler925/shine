name: shine

# Runs on a GitHub-hosted runner. This lane previously targeted
# `[self-hosted, macOS, ARM64, shine]`, and no such runner was ever registered —
# so every run sat queued until GitHub expired it. 34 runs, 0 successes.
# `--ci` skips every machine-local check (hook wirings, skill symlinks, vendored
# copies), so nothing here needs a Mac or a populated ~/design-corpus.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: shine doctor (--ci)
        run: node verify/doctor.mjs --ci

      - name: tokens build is committed
        working-directory: tokens
        run: |
          npm ci
          node scripts/gen-source.mjs
          npm run build
          git diff --exit-code -- src dist || {
            echo "::error::tokens/src or tokens/dist differ after a rebuild — run (cd tokens && node scripts/gen-source.mjs && npm run build) and commit"
            exit 1
          }
