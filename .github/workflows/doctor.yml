name: shine

# Repo-registered self-hosted Mac runner. GitHub-hosted ubuntu-latest is
# blocked for this account ("account is locked due to a billing issue") —
# same Free workaround as alicia-ci. Unlock hosted later via Settings → Billing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  doctor-default:
    name: doctor-default
    runs-on: [self-hosted, macOS, ARM64, shine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install root deps
        run: npm ci
      - name: install pinned integration runtimes
        working-directory: verify/fixtures/integrations
        run: npm ci --ignore-scripts
      # Fail-fast content gate: homepage skill tree + public SKILL.md must match
      # disk. Doctor also runs this, but AST/skill-doc PRs have landed STALE when
      # Mac doctor was still queued and merges used --admin. Named step first.
      - name: skill-listing content gate
        run: node site/scripts/skill-listing.mjs --check
      - name: fast import and seeded gates
        run: node verify/doctor.mjs --ci --quiet
      - name: Integration readiness and private edition integrity
        run: npm run integration:test
      - name: workflow lanes cannot disappear
        run: node verify/workflow-contract.test.mjs
      - name: tokens build is committed
        working-directory: tokens
        run: |
          npm ci
          node scripts/gen-source.mjs
          npm run build
          git diff --exit-code -- src dist || {
            echo "::error::tokens/src or tokens/dist differ after rebuild"
            exit 1
          }

  doctor-full:
    name: doctor-full
    runs-on: [self-hosted, macOS, ARM64, shine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install root deps
        run: npm ci
      - name: install pinned integration runtimes
        working-directory: verify/fixtures/integrations
        run: npm ci --ignore-scripts
      - name: skill-listing content gate
        run: node site/scripts/skill-listing.mjs --check
      - name: browser interaction, visual proof, and designated consumers
        run: node verify/doctor.mjs --ci --full --quiet

      - name: Complete example suite, every page and workflow
        run: npm run showcase:test
