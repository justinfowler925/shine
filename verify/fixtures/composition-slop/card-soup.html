<!doctype html>
<!-- shine-lint: off color,type,spacing — composition-slop adversarial fixture -->
<html lang="en" data-cite="shadcn-catalog">
<head><meta charset="utf-8"/><title>Card soup</title>
<style>
:root{color-scheme:light}body{margin:0;font:14px/1.5 system-ui;background:#fafafa;color:#18181b}
main{padding:24px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:16px;min-height:112px}
button{background:#18181b;color:#fff;border:0;padding:8px 16px;border-radius:8px;font:inherit;margin-top:16px}
</style></head>
<body><main>
<h1>Tools</h1>
<section class="cards">
<article class="card" data-slot="card"><h2>A</h2><p>One</p></article>
<article class="card" data-slot="card"><h2>B</h2><p>Two</p></article>
<article class="card" data-slot="card"><h2>C</h2><p>Three</p></article>
<article class="card" data-slot="card"><h2>D</h2><p>Four</p></article>
</section>
<button type="button">Open</button>
</main></body></html>
