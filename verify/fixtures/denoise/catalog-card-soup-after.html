<!doctype html>
<!-- shine-lint: off color,type,spacing — pinned card-soup after -->
<html lang="en" data-cite="shadcn-catalog" data-shine-probe="app-shell">
<head>
<meta charset="utf-8"/>
<title>Catalog · card soup PASS</title>
<style>
:root{color-scheme:light}body{margin:0;font:14px/1.5 system-ui;background:#fafafa;color:#18181b}
main{padding:24px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:16px;min-height:112px}
button{background:#18181b;color:#fff;border:0;padding:8px 14px;border-radius:8px;font:inherit;margin-top:16px}
</style>
</head>
<body>
<main data-shine-main>
  <h1>Tools</h1>
  <section class="cards" data-shine-card-stack>
    <article class="card" data-slot="card" data-shine-card data-region="focal" data-shine-card-primary><h2>Capture</h2><p>Queue triage</p></article>
    <details data-shine-card-rest><summary>More tools</summary>
      <article class="card" data-slot="card" data-shine-card data-shine-card-demoted><h2>Sources</h2><p>Ingest feeds</p></article>
      <article class="card" data-slot="card" data-shine-card data-shine-card-demoted><h2>Recipes</h2><p>Automations</p></article>
      <article class="card" data-slot="card" data-shine-card data-shine-card-demoted><h2>Reports</h2><p>Exports</p></article>
    </details>
  </section>
  <button type="button">Open</button>
</main>
</body>
</html>
