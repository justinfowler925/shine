<!doctype html>
<!-- shine-lint: off color,type,spacing — pinned pill-filter badge/chip deepen before -->
<html lang="en" data-cite="shadcn-queue" data-shine-probe="app-shell">
<head>
<meta charset="utf-8"/>
<title>Queue · pill badge/chip FAIL</title>
<style>
:root{color-scheme:light}body{margin:0;font:14px/1.5 system-ui;background:#fafafa;color:#18181b}
main{padding:24px}.filter-pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1px solid #e4e4e7;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:12px;display:inline-block}

</style>
</head>
<body>
<main data-shine-main>
  <h1>Queue</h1>
  <div class="filter-pills" data-shine-filter-stack aria-label="Filters">
    <span class="chip" data-slot="badge" data-filter="status">Status</span>
    <span class="chip" data-slot="badge" data-filter="owner">Owner</span>
    <span class="chip" data-slot="badge" data-filter="score">Score</span>
    <span class="chip" data-slot="badge" data-filter="source">Source</span>
    <span class="chip" data-slot="badge" data-filter="region">Region</span>
    <span class="chip" data-slot="badge" data-filter="due">Due</span>
    <span class="chip" data-slot="badge" data-filter="tag">Tag</span>
  </div>
  <table role="grid" data-shine-datagrid data-region="focal">
    <thead><tr><th>Notice</th><th>Decision</th></tr></thead>
    <tbody><tr><td>NV DPS voice risk RFI</td><td><button type="button">Pursue</button></td></tr></tbody>
  </table>
</main>
