<!doctype html>
<html lang="en" data-cite="shadcn-queue" data-product-pattern="source-directory">
<head>
<meta charset="utf-8"/><title>SLED — Sources & recipes</title>
<style>
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:#fff;color:#18181b}
main{padding:24px;max-width:960px;margin:0 auto}
header{display:flex;justify-content:space-between;gap:16px;margin-bottom:16px}
.btn{border:1px solid #e4e4e7;background:#fff;padding:8px 12px;border-radius:6px;font:inherit}
.btn.filled{background:#18181b;color:#fff;font-weight:600}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{border:1px solid #e4e4e7;background:#fff;padding:8px 12px;border-radius:6px}
.pack{display:flex;justify-content:space-between;border:1px solid #e4e4e7;border-radius:8px;padding:12px;margin:8px 0}
.card{border:1px solid #e4e4e7;border-radius:10px;padding:14px;margin:8px 0;min-height:100px}
</style>
</head>
<body>
<main data-shine-main aria-label="SLED sources and recipes">
  <header>
    <div>
      <h1>Sources &amp; recipes</h1>
      <p>Select a source to inspect its collection results and tune its recipe.</p>
    </div>
    <button type="button" class="btn filled">Add source</button>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" aria-selected="true">Sources</button>
    <button type="button" role="tab">Matching rules</button>
    <button type="button" role="tab">Run history</button>
  </div>
  <section class="card"><h2>Source directory</h2><p>Directory rows live here — cite is wrongly shadcn-queue.</p></section>
  <section class="card pack"><div><strong>Voice pack</strong><span>12 terms</span></div><button type="button" class="btn">Edit keywords</button></section>
  <section class="card pack"><div><strong>Compliance pack</strong><span>8 terms</span></div><button type="button" class="btn">Edit keywords</button></section>
  <button type="button" class="btn">Reload settings</button>
</main>
</body>
</html>
