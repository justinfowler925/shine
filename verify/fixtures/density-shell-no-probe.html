<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chrome-heavy shell without probe</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #0c0a09;
      color: #fafaf9;
      font: 15px/1.5 system-ui;
      display: flex;
    }
    aside {
      width: 420px;
      height: 100vh;
      border-right: 1px solid #333;
      padding: 16px;
    }
    main { flex: 1; padding: 16px; }
    button {
      background: #a8a29e;
      color: #0c0a09;
      border: 0;
      padding: 10px 16px;
      font: inherit;
    }
  </style>
</head>
<body>
  <!-- Intentionally omits the app-shell shine probe attribute. M2 density must
       still hard-fail under --lane saas|internal or a shell cite. -->
  <aside>
    <p>Workspace</p>
    <p>Inbox</p>
    <p>Accounts</p>
    <p>Settings</p>
  </aside>
  <main>
    <h1>Almost empty</h1>
    <p><button>Open next</button></p>
  </main>
</body>
</html>
