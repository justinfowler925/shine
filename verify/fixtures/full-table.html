<!doctype html>
<html lang="en" data-cite="untitled-table" data-dna-family="untitled" data-shine-voice="kit-faithful">
<head>
  <meta charset="utf-8"><title>Complete DataGrid contract</title>
  <style>
    :root{color-scheme:dark}body{margin:0;background:#0c0a09;color:#fafaf9;font:15px/1.5 system-ui;padding:24px}
    button{min-height:40px}button.primary{background:#a8a29e;color:#0c0a09;border:0;padding:10px 16px}.toolbar{display:flex;gap:12px;margin:16px 0}
    [data-grid-scroll]{overflow-x:auto}table{width:100%;border-collapse:collapse}thead{position:sticky;top:0;background:#0c0a09}th,td{text-align:left;padding:12px;border-bottom:1px solid #444}
  </style>
</head>
<body><main data-grid>
  <h1>Employees</h1><p>A functional grid with every default contract capability.</p>
  <div class="toolbar" data-toolbar role="search">
    <input type="search" aria-label="Search employees" data-shine-probe-value="zzzz" data-task-control><button data-clear-filters>Clear filters</button>
    <span data-state="loading">Loading state</span><span data-state="empty">Empty state</span><span data-state="filtered-empty">Filtered empty state</span>
    <span data-state="error" role="alert">Error state <button data-retry>Retry</button></span>
  </div>
  <div data-grid-scroll><table id="employees" data-shine-contract="table" data-client-mode>
    <thead><tr><th aria-sort="none"><button data-sort>Name</button><span role="separator" data-column-resize></span></th><th>Title</th><th>Actions</th></tr></thead>
    <tbody data-task-result><tr><td>Ada</td><td>Analyst</td><td><button data-row-action>Open</button></td></tr><tr><td>Grace</td><td>Lead</td><td><button data-row-action>Open</button></td></tr></tbody>
  </table></div>
  <nav data-pagination aria-label="Pagination"><span data-page-size>10/page</span><span data-page-range>1–2</span><span data-total>2 total</span><button>Previous</button><button data-page-next>Next</button></nav>
  <script>
    const table=document.querySelector('table'),body=table.tBodies[0],search=document.querySelector('input[type=search]');
    document.querySelector('[data-sort]').onclick=()=>{const rows=[...body.rows].reverse();rows.forEach(r=>body.append(r));table.querySelector('[aria-sort]').setAttribute('aria-sort','ascending')};
    search.oninput=()=>{for(const row of body.rows)row.hidden=search.value&& !row.innerText.toLowerCase().includes(search.value.toLowerCase())};
    document.querySelector('[data-clear-filters]').onclick=()=>{search.value='';search.dispatchEvent(new InputEvent('input',{bubbles:true}))};
    document.querySelector('[data-page-next]').onclick=()=>{[...body.rows].forEach(r=>body.append(r));body.rows[0].cells[0].textContent+=' next'};
  </script>
</main></body></html>
