<!-- M5 adversarial: ≥3 equal-weight KPI cards, no focal chart/table — must fail under dashboard cite/probe. -->
<!doctype html>
<html lang="en" data-cite="shadcn-dashboard-01" data-shine-probe="dashboard">
<head>
  <meta charset="utf-8" />
  <title>KPI soup — no focal</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fafaf9; color: #1c1917; }
    main { padding: 24px; max-width: 960px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .kpi {
      border: 1px solid #d6d3d1; border-radius: 8px; padding: 20px; background: #fff;
      min-height: 120px;
    }
    .kpi .label { font-size: 13px; color: #78716c; }
    .kpi .value { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 8px; }
    button { margin-top: 24px; background: #1c1917; color: #fff; border: 0; padding: 10px 16px; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Revenue cockpit</h1>
    <section class="kpi-row" data-summary aria-label="Summary metrics">
      <div class="kpi"><div class="label">ARR</div><div class="value">$1.2M</div></div>
      <div class="kpi"><div class="label">NRR</div><div class="value">112%</div></div>
      <div class="kpi"><div class="label">Pipeline</div><div class="value">$4.8M</div></div>
    </section>
    <p><button type="button" data-primary>Open queue</button></p>
  </main>
</body>
</html>
